global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: metl-production
    replica: '{{.ExternalURL}}'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alert-rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['metl-app-server:8080']
    metrics_path: /metrics

  # Node Exporter (if installed on VMs)
  - job_name: 'node-exporter'
    static_configs:
      - targets:
        - 'metl-app-server:9100'
        - 'metl-data-server:9100'
        - 'metl-ai-worker:9100'

  # Docker containers
  - job_name: 'docker'
    static_configs:
      - targets:
        - 'metl-app-server:9323'

  # Control-Plane
  - job_name: 'control-plane'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['control-plane:3001']

  # PostgreSQL Exporter (add if deployed)
  - job_name: 'postgres'
    static_configs:
      - targets: ['metl-data-server:9187']

  # Redis Exporter (add if deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['metl-data-server:9121']

  # NATS
  - job_name: 'nats'
    static_configs:
      - targets: ['metl-data-server:7777']

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['metl-data-server:3001']

  # Service discovery for Docker containers with labels
  - job_name: 'docker-sd'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        filters:
          - name: label
            values: ["prometheus.io/scrape=true"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_label_prometheus_io_port]
        target_label: __address__
        regex: (.+)
        replacement: ${1}
        action: replace
