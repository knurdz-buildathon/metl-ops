# ============================================
# Metl Production — VM-2: Data Server
# PostgreSQL, Redis, NATS JetStream, SonarQube
# Prometheus, Grafana
# ============================================
name: metl-data

services:
  postgres:
    image: postgres:15-alpine
    container_name: metl-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - metl-data
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "logging_collector=on"
      - "-c"
      - "max_connections=200"

  redis:
    image: redis:7-alpine
    container_name: metl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - metl-data

  nats:
    image: nats:2.10-alpine
    container_name: metl-nats
    restart: unless-stopped
    ports:
      - "4222:4222"
      - "8222:8222"
      - "6222:6222"
    command: >
      --name metl-nats
      --jetstream
      --store_dir /data/jetstream
      --http_port 8222
    volumes:
      - nats_data:/data/jetstream
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - metl-data

  sonarqube:
    image: sonarqube:10.4-community
    container_name: metl-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/metl
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
      SONAR_WEB_JAVAADDITIONALOPTS: >-
        -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-1.19.0.jar=web
      SONAR_CE_JAVAADDITIONALOPTS: >-
        -javaagent:/opt/sonarqube/extensions/plugins/sonarqube-community-branch-plugin-1.19.0.jar=ce
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - ./init-scripts:/init-scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - metl-data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  sonarqube-init:
    image: alpine/curl
    container_name: metl-sonarqube-init
    restart: "no"
    environment:
      SONARQUBE_URL: http://sonarqube:9000
      SONARQUBE_ADMIN_PASSWORD: ${SONARQUBE_ADMIN_PASSWORD:-changeme}
    volumes:
      - ./init-scripts:/init-scripts:ro
    command: ["sh", "/init-scripts/02-init-sonarqube.sh"]
    depends_on:
      sonarqube:
        condition: service_healthy
    networks:
      - metl-data

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: metl-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules:/etc/prometheus/alert-rules:ro
      - prometheus_data:/prometheus
    networks:
      - metl-data

  grafana:
    image: grafana/grafana:10.4.2
    container_name: metl-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - metl-data

  # Automated PostgreSQL backups
  pgbackup:
    image: offen/docker-volume-backup:v2
    container_name: metl-pgbackup
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "0 2 * * *"
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_FILENAME: "backup-%Y-%m-%dT%H-%M-%S.tar.gz"
      BACKUP_ARCHIVE: "/archive"
      # Uncomment and configure for Azure Blob Storage backups:
      # AZURE_STORAGE_ACCOUNT_NAME: ${AZURE_STORAGE_ACCOUNT}
      # AZURE_STORAGE_PRIMARY_ACCOUNT_KEY: ${AZURE_STORAGE_KEY}
      # AZURE_STORAGE_CONTAINER_NAME: ${AZURE_BACKUP_CONTAINER}
    volumes:
      - postgres_data:/backup/postgres:ro
      - redis_data:/backup/redis:ro
      - ./backups/archive:/archive
    networks:
      - metl-data

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  metl-data:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
